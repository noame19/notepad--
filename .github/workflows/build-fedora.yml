name: 在 Fedora 44 容器里编译 .AppImage（v3.8.3 分支专用）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
      - name: 拉取代码（v3.8.3 分支）
        uses: actions/checkout@v4
        with:
          ref: v3.8.3

      - name: 安装编译依赖（编译工具链 + Qt5 + fuse）
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake ninja-build gcc-c++ make \
            qt5-qtbase-devel \
            qt5-qtsvg-devel \
            qt5-qtxmlpatterns-devel \
            fuse \
            curl \
            zsync

      - name: 下载 linuxdeploy 工具链（GitHub release 直接拿二进制）
        run: |
          cd /tmp
          curl -L -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          
          # AppImage 在容器里要 --appimage-extract-and-run 跑
          mkdir -p /opt/linuxdeploy/bin
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run --help > /dev/null 2>&1 || true
          # 用 squashfs-root 里的可执行
          if [ -d squashfs-root ]; then
            cp -r squashfs-root/* /opt/linuxdeploy/
          fi
          ln -sf /opt/linuxdeploy/usr/bin/linuxdeploy /usr/local/bin/linuxdeploy
          
          ./linuxdeploy-plugin-qt-x86_64.AppImage --appimage-extract-and-run --help > /dev/null 2>&1 || true
          if [ -d squashfs-root ]; then
            cp -r squashfs-root/usr/* /opt/linuxdeploy/usr/ 2>/dev/null || true
          fi
          ln -sf /opt/linuxdeploy/usr/bin/linuxdeploy-plugin-qt /usr/local/bin/linuxdeploy-plugin-qt
          
          which linuxdeploy
          linuxdeploy --version

      - name: 配置 cmake
        run: |
          mkdir -p build && cd build
          cmake -S ../how_build -B . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: 编译源码
        run: |
          cd build
          cmake --build . --parallel

      - name: 准备 AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/128x128/apps
          mkdir -p AppDir/usr/share/metainfo
          
          cp build/NotePad-- AppDir/usr/bin/NotePad--
          chmod +x AppDir/usr/bin/NotePad--
          
          cp -r src/linux/usr/share/applications/* AppDir/usr/share/applications/
          cp -r src/linux/usr/share/icons/hicolor/128x128/apps/* AppDir/usr/share/icons/hicolor/128x128/apps/
          cp -r src/linux/usr/share/metainfo/* AppDir/usr/share/metainfo/ 2>/dev/null || true

      - name: 用 linuxdeploy 生成 AppImage
        env:
          QT_SELECT: qt5
        run: |
          cd AppDir
          export QML_SOURCES_PATHS=$(pwd)
          
          linuxdeploy \
            --appdir . \
            --executable usr/bin/NotePad-- \
            --desktop-file usr/share/applications/NotePad--.desktop \
            --icon-file usr/share/icons/hicolor/128x128/apps/notepad--.png \
            --plugin qt \
            --output appimage
          
          echo "---生成的 AppImage---"
          ls -lh *.AppImage

      - name: 上传 AppImage 产物
        uses: actions/upload-artifact@v4
        with:
          name: notepad-appimage-v3.8.3
          path: AppDir/*.AppImage
          if-no-files-found: error