name: 在 Fedora 44 容器里编译 .rpm 包（v3.8.3 分支专用）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
      - name: 拉取代码（v3.8.3 分支）
        uses: actions/checkout@v4
        with:
          ref: v3.8.3

      - name: 安装编译依赖（Qt5 开发包 + cmake + ninja + rpm-build）
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake ninja-build gcc-c++ make \
            qt5-qtbase-devel \
            qt5-qtsvg-devel \
            qt5-qtxmlpatterns-devel \
            rpm-build

      - name: 配置 cmake（指定 RPM 打包，源目录 how_build）
        run: |
          mkdir -p build && cd build
          cmake -S ../how_build -B . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPACK_GENERATOR=RPM

      - name: 编译源码
        run: |
          cd build
          cmake --build . --parallel

      - name: 打 RPM 包
        run: |
          cd build
          cpack -G RPM

      - name: 上传 RPM 产物
        uses: actions/upload-artifact@v4
        with:
          name: notepad-rpm-v3.8.3
          path: build/*.rpm
          if-no-files-found: error