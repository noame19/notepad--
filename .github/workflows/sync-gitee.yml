name: 一次性同步 gitee v3.8.3 源码到 fork（用完可删）

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许 push 到自己 fork 的分支

    steps:
      - name: 从 gitee 拉取 v3.8.3 源码
        run: |
          git clone --filter=blob:none --no-checkout https://gitee.com/cxasm/notepad--.git gitee-src
          cd gitee-src
          git checkout 91105f68b7

      - name: 推送到 fork 的 v3.8.3 分支
        run: |
          cd gitee-src
          git config user.email "sync-bot@users.noreply.github.com"
          git config user.name "gitee-sync"
          git remote add fork https://x-access-token:${GITHUB_TOKEN}@github.com/noame19/notepad--.git
          git push fork HEAD:refs/heads/v3.8.3 --force